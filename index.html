<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>PTJ Scanner</title>

	<link rel="manifest" href="./manifest.json">
	<meta name="theme-color" content="#f0f2f5">
	<meta name="mobile-web-app-capable" content="yes">

	<link rel="icon" type="image/png" href="./images/icon-192.png">
	<link rel="stylesheet" href="./style.css">
</head>

<body>
	<!-- 1. 로그인 전용 화면 -->
	<div id="loginContainer" class="login-container" style="display:none;">
		<div class="login-card">
			<div class="header-main-title" style="justify-content: center; margin-bottom: 6px;">
				<span class="brand-accent">PTJ</span>
				<span class="brand-title">Scanner</span>
			</div>
			<p class="login-sub-text">시스템 접근을 위해 로그인해 주세요.</p>

			<form id="loginForm" onsubmit="handleLoginSubmit(event)">
				<div class="login-input-group">
					<input type="text" id="loginId" class="login-input" placeholder="아이디" autocomplete="username" required>
				</div>
				<div class="login-input-group">
					<input type="password" id="loginPw" class="login-input" placeholder="비밀번호"
						autocomplete="current-password" required>
				</div>
				<button type="submit" id="btnLoginSubmit" class="btn-login-submit">로그인</button>
			</form>
		</div>
	</div>

	<!-- 2. 메인 스캐너 앱 화면 (기존 container에 id="appContainer" 추가) -->
	<div class="container" id="appContainer" style="display:none;">
		<!-- 상단 헤더 영역 -->
		<div class="macro-header-container">
			<div class="header-brand-wrap">
				<div class="header-main-title">
					<span class="brand-accent">PTJ</span>
					<span class="brand-title">Scanner</span>
				</div>
				<div class="header-sub-caption">Position & Trail Judge System</div>
			</div>
			<div class="header-right-actions">
				<div id="macroStatusBadge" class="macro-indicator-badge macro-bull" onclick="showTip('market')">
					<span id="macroStatusDot" class="macro-dot dot-bull"></span>
					<span id="macroStatusText">SYNCING...</span>
				</div>
				<button type="button" id="btnRefresh" class="btn-refresh" title="시세 새로고침"
					onclick="fetchStockData(currentSelectedTicker, true)">
					<svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-1.19" />
					</svg>
				</button>
				<!-- 로그아웃 버튼 추가 -->
				<button type="button" id="btnLogout" class="btn-refresh" title="로그아웃" onclick="handleLogout()">
					<svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
						<polyline points="16 17 21 12 16 7"></polyline>
						<line x1="21" y1="12" x2="9" y2="12"></line>
					</svg>
				</button>
			</div>
		</div>

		<!-- 시장 추세 카드 (모바일 상하 2행 / PC 좌우 2열) -->
		<div class="market-card">
			<div class="market-header-row">
				<div class="market-title-wrap">
					<span>시장 추세</span>
					<span class="market-sub-text">(200일선 대비)</span>
				</div>
				<button type="button" class="btn-tip" onclick="showTip('market')">ℹ️</button>
			</div>
			<div class="market-items-grid">
				<a href="https://finviz.com/index/SPX" target="_blank" rel="noopener noreferrer"
					class="market-item-link" title="Finviz S&P 500 차트 보기">
					<span class="market-name">S&P500</span>
					<div class="market-val-group">
						<span class="market-val" id="valSP500">-</span>
						<span class="market-pill market-up" id="pillSP500">...</span>
					</div>
				</a>
				<a href="https://finviz.com/index/COMP" target="_blank" rel="noopener noreferrer"
					class="market-item-link" title="Finviz 나스닥 차트 보기">
					<span class="market-name">나스닥</span>
					<div class="market-val-group">
						<span class="market-val" id="valNASDAQ">-</span>
						<span class="market-pill market-up" id="pillNASDAQ">...</span>
					</div>
				</a>
			</div>
		</div>

		<!-- 모바일 뷰 모드 스위처 (모바일 전용) -->
		<div class="view-mode-controller mobile-only">
			<div class="seg-btn-group">
				<button type="button" id="btnViewList" class="seg-btn active" onclick="switchViewMode('list')">☰ 리스트
					뷰</button>
				<button type="button" id="btnViewCard" class="seg-btn" onclick="switchViewMode('card')">🗂️ 카드
					뷰</button>
			</div>
		</div>

		<!-- 종목 칩 리스트 (모바일 카드 뷰 전용) -->
		<div class="chip-wrapper mobile-only" id="chipWrapper" style="display:none;">
			<div class="chip-container" id="chipContainer">
				<div id="chipList" style="display: flex; gap: 6px;"></div>
				<button type="button" id="btnAddChip" class="btn-add-chip">+ 새 종목</button>
			</div>
		</div>

		<!-- 상태 메시지 -->
		<div id="statusMsg" class="status-msg">데이터 동기화 중...</div>

		<!-- 메인 컨텐츠 영역 (PC에서는 좌/우 스플릿 2단 배치) -->
		<div class="main-content-layout">
			<!-- 1. 리스트 뷰 영역 -->
			<div id="listViewArea" class="content-pane list-pane" style="display:none;">
				<div class="list-view-container" id="stockListContainer"></div>
				<div style="text-align: center; margin-top: 14px;">
					<button type="button" class="btn-add-chip" onclick="openAddStockDialog('')"
						style="display:inline-block; padding: 9px 20px; font-size: 13.5px;">+ 새 종목 등록하기</button>
				</div>
			</div>

			<!-- 2. 카드 뷰 영역 -->
			<div id="cardViewArea" class="content-pane card-pane" style="display:none;">
				<div class="card-wrapper">
					<div class="card" id="stockCard">
						<!-- 상단 히어로 헤더 -->
						<div class="hero-header">
							<div class="hero-left">
								<div class="hero-title-row">
									<div class="ticker-link-wrap">
										<span class="hero-title" id="resTicker"></span>
										<a id="linkFinviz" href="#" target="_blank" rel="noopener noreferrer"
											class="btn-finviz-chart">📈</a>
									</div>
									<span class="hero-corp-name" id="resCorpName" onclick="showTip('corpName')"></span>
								</div>
								<div class="hero-price" id="resPrice"></div>
							</div>
							<div class="hero-right">
								<div class="header-badge-row">
									<div id="decisionBadge" class="badge" onclick="showTip('decision')"></div>
									<button type="button" class="btn-tip" onclick="showTip('decision')">ℹ️</button>
								</div>
								<div class="header-badge-row">
									<div id="resATHPill" class="trend-pill" onclick="showTip('ath')"></div>
									<button type="button" class="btn-tip" onclick="showTip('ath')">ℹ️</button>
								</div>
							</div>
						</div>

						<!-- 시세 게이지 섹션 -->
						<div class="price-range-section">
							<div class="range-header">
								<span class="range-title">시세</span>
								<button type="button" class="btn-tip" onclick="showTip('priceRange')">ℹ️</button>
							</div>

							<!-- 1. 당일 가격 범위 (Day Range) -->
							<div class="range-item">
								<div class="range-track-wrap">
									<div class="range-track">
										<div class="range-pin" id="dayRangePin" style="left: 50%;"></div>
									</div>
								</div>
								<div class="range-meta-row">
									<div class="range-meta-col left">
										<span class="range-lbl">1일 최저</span>
										<span class="range-val" id="resDayLow">-</span>
									</div>
									<div class="range-meta-col right">
										<span class="range-lbl">1일 최고</span>
										<span class="range-val" id="resDayHigh">-</span>
									</div>
								</div>
							</div>

							<!-- 2. 1년 가격 범위 (52W Range) -->
							<div class="range-item">
								<div class="range-track-wrap">
									<div class="range-track">
										<div class="range-pin" id="yearRangePin" style="left: 50%;"></div>
									</div>
								</div>
								<div class="range-meta-row">
									<div class="range-meta-col left">
										<span class="range-lbl">1년 최저</span>
										<span class="range-val" id="resYearLow">-</span>
									</div>
									<div class="range-meta-col right">
										<span class="range-lbl">1년 최고</span>
										<span class="range-val" id="resYearHigh">-</span>
									</div>
								</div>
							</div>
						</div>

						<!-- 신규 전략 4분할 통계 그리드 -->
						<div class="stat-grid">
							<!-- 1. 52주 최고가 (52W High) -->
							<div class="stat-box highlight-box">
								<div class="stat-label-row">
									<span class="stat-label">52주 최고가 (52W High)</span>
									<button type="button" class="btn-tip" onclick="showTip('ath')">ℹ️</button>
								</div>
								<div class="stat-val">
									<span id="resHigh52">-</span>
									<span class="drawdown-sub" id="resDrawdownATH"></span>
								</div>
							</div>

							<!-- 2. 30일 박스권 범위 (상단~하단) -->
							<div class="stat-box">
								<div class="stat-label-row">
									<div class="stat-label-left">
										<span class="stat-label">30일 박스권</span>
										<span id="resBoxRangeBadge" class="base-tag">-</span>
									</div>
									<button type="button" class="btn-tip" onclick="showTip('box')">ℹ️</button>
								</div>
								<div class="stat-val box-range-val">
									<span id="resBoxLow" style="color: #1a73e8;">-</span>
									<span class="range-separator">~</span>
									<span id="resBoxHigh" style="color: #4e5968;">-</span>
								</div>
							</div>

							<!-- 3. 이평선 3단 풀 배경 행 (5MA / 10MA / 20MA) -->
							<div class="stat-box ma-stat-box">
								<div class="stat-label-row">
									<span class="stat-label">5·10·20선 (MA)</span>
									<button type="button" class="btn-tip" onclick="showTip('maLevels')">ℹ️</button>
								</div>
								<div class="ma-strip-container">
									<div class="ma-strip-row" id="stripMA5">
										<span class="ma-strip-lbl">5MA</span>
										<span class="ma-strip-price" id="valMA5">-</span>
										<span class="ma-strip-badge" id="badgeMA5">-</span>
									</div>
									<div class="ma-strip-row" id="stripMA10">
										<span class="ma-strip-lbl">10MA</span>
										<span class="ma-strip-price" id="valMA10">-</span>
										<span class="ma-strip-badge" id="badgeMA10">-</span>
									</div>
									<div class="ma-strip-row" id="stripMA20">
										<span class="ma-strip-lbl">20MA</span>
										<span class="ma-strip-price" id="valMA20">-</span>
										<span class="ma-strip-badge" id="badgeMA20">-</span>
									</div>
								</div>
							</div>

							<!-- 4. 대응 가이드 -->
							<div class="stat-box exit-stat-box" id="boxExitTrigger">
								<div class="stat-label-row">
									<div class="stat-label-left">
										<span class="stat-label">대응 가이드</span>
									</div>
									<button type="button" class="btn-tip" onclick="showTip('exitRule')">ℹ️</button>
								</div>
								<div class="exit-rule-content">
									<div class="exit-line-main" id="resExitMain">-</div>
									<div class="exit-line-sub" id="resExitSub">-</div>
								</div>
							</div>
						</div>

						<!-- 푸터 영역 -->
						<div class="card-footer">
							<div class="footer-left">
								<span class="tradetime-val" id="resTradeTime">-</span>
								<button type="button" class="btn-tip" onclick="showTip('tradetime')">ℹ️</button>
							</div>
							<div class="footer-right">
								<button type="button" id="btnEditStock" class="btn-footer btn-edit">✏️ 수정</button>
								<button type="button" id="btnDeleteStock" class="btn-footer btn-delete">🗑️ 삭제</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 커스텀 모달 알림창 -->
	<div id="swalBackdrop" class="swal-backdrop">
		<div class="swal-card" id="swalCard">
			<div id="swalIcon" class="swal-icon"></div>
			<div id="swalSpinner" class="swal-spinner" style="display:none;"></div>
			<div id="swalTitle" class="swal-title"></div>
			<div id="swalText" class="swal-text"></div>
			<input type="text" id="swalInput" class="swal-input" style="display:none;" autocomplete="off"
				autocapitalize="characters">
			<div id="swalActions" class="swal-actions">
				<button type="button" id="swalCancelBtn" class="swal-btn swal-btn-cancel"
					style="display:none;">취소</button>
				<button type="button" id="swalConfirmBtn" class="swal-btn swal-btn-confirm">확인</button>
			</div>
		</div>
	</div>

	<!-- 버전 쿼리스트링으로 모바일 브라우저 캐시 방어 -->
	<script src="./app.js?v=2.2"></script>
</body>

</html>
